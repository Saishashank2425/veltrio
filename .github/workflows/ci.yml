name: Veltrio CI

on:
  push:
    branches: [main, "polish/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veltrio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/veltrio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test authorization gateway
        run: npm run test:gateway
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build production app
        run: npm run build
      - name: Smoke-test production API
        run: npm run test:e2e
