name: Veltrio CI

on:
  push:
    branches: [main, "polish/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test authorization gateway
        run: npm run test:gateway
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build production app
        run: npm run build
